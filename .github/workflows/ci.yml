name: CI

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [vercel.deployment.success]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref || github.event.client_payload.git.sha || github.run_id }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.10.0

jobs:
  quality:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci

  database-security:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hope_test

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql-client

      - run: pnpm install --frozen-lockfile

      - name: Apply database roles and migrations
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Parallel rate-limit and RLS integration tests
        run: pnpm --filter @hope/wishes-infrastructure test:integration

  lighthouse:
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'vercel.deployment.success' &&
      (github.event.client_payload.environment == 'preview' || github.event.client_payload.environment == 'production')
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        form-factor: [desktop, mobile]

    env:
      LHCI_FORM_FACTOR: ${{ matrix.form-factor }}
      LHCI_BASE_URL: ${{ github.event.client_payload.url }}
      LHCI_DEPLOYMENT_ENV: ${{ github.event.client_payload.environment }}
      LHCI_ALLOWED_HOST_SUFFIXES: ${{ vars.VERCEL_ALLOWED_DEPLOYMENT_HOST_SUFFIXES || '.vercel.app' }}

    steps:
      - name: Validate Vercel deployment event
        shell: bash
        env:
          EXPECTED_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          ACTUAL_PROJECT_ID: ${{ github.event.client_payload.project.id }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_PROJECT_ID:-}" ]; then
            echo "Missing VERCEL_PROJECT_ID GitHub Actions repository variable." >&2
            exit 1
          fi
          if [ "$ACTUAL_PROJECT_ID" != "$EXPECTED_PROJECT_ID" ]; then
            echo "Ignoring deployment for an unexpected Vercel project." >&2
            exit 1
          fi

      # repository_dispatch workflows run from the default branch. Keep checkout explicit so
      # Preview code cannot replace the credential-handling scripts used by this job.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - run: pnpm install --frozen-lockfile

      - name: Locate Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "Chrome/Chromium was not found on the runner." >&2
            exit 1
          fi
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"

      - name: Prepare protected Preview credential
        if: github.event.client_payload.environment == 'preview'
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "Missing VERCEL_AUTOMATION_BYPASS_SECRET GitHub Actions secret." >&2
            exit 1
          fi
          secret_file="$RUNNER_TEMP/vercel-automation-bypass"
          umask 077
          printf '%s' "$VERCEL_AUTOMATION_BYPASS_SECRET" > "$secret_file"
          echo "LHCI_BYPASS_SECRET_FILE=$secret_file" >> "$GITHUB_ENV"

      - name: Verify real deployment routes and APIs
        run: node scripts/verify-deployment.mjs

      - name: Run Lighthouse
        run: pnpm lighthouse

      - name: Remove temporary credential
        if: always()
        shell: bash
        run: rm -f "${LHCI_BYPASS_SECRET_FILE:-}"
