packages:
  - apps/*
  - packages/*

# pnpm 11 supply-chain policy
autoInstallPeers: true
strictPeerDependencies: false
engineStrict: true

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

# Temporary exception for the reviewed locked version.
# Remove this after obug@2.1.4 is older than 24 hours.
minimumReleaseAgeExclude:
  - "obug@2.1.4"

blockExoticSubdeps: true
strictDepBuilds: true
trustLockfile: false
verifyDepsBeforeRun: install

allowBuilds:
  esbuild: true

auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv

overrides:
  tmp: 0.2.7
  uuid: 11.1.1

  "ip-address@10.2.0": 10.3.1
  "fast-uri@3.1.3": 3.1.6
  "postcss@8.5.19": 8.5.23

  "brace-expansion@1.1.16": 1.1.18
  "brace-expansion@5.0.7": 5.0.9

  "js-yaml@3.15.0": 3.15.1
  "js-yaml@4.3.0": 4.3.1

  "nanoid@3.3.16": 3.3.18
  "tar@7.5.20": 7.5.22

  "path-to-regexp@6.1.0": 6.3.0